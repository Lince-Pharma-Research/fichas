name: Fichas semanales

on:
  schedule:
    # Todos los lunes a las 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch: {}
  push:
    # Si editas los datos manuales o el script, las fichas se regeneran solas
    paths:
      - "datos_manuales.py"
      - "ficha_empresa.py"

permissions:
  contents: write

jobs:
  fichas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar fichas
        run: python ficha_empresa.py

      - name: Guardar las fichas en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "Fichas: $(date -u +%Y-%m-%d)"
          git push
